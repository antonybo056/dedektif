<title>Kuzgun Köşkü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#11161d; --panel:#18202a; --panel2:#202935; --line:#2c3745; --text:#e2e6eb; --muted:#8f9bac; --faint:#5f6b7b;
  --paper:#ece3cd; --paper2:#e0d4b8; --ink:#2a251e; --ink-soft:#6f6452; --rule:#cdbf9f;
  --tag:#d9a54a; --tag-ink:#1c1507; --string:#c43b2c; --cork:#7a5838;
  --ok:#62b07f; --bad:#d65c4f;
  --t-foto:#b89bd8; --t-mesaj:#6db4c5; --t-ses:#e28b5e; --t-kamera:#8ea9e2; --t-belge:#a0c78c;
  --f-disp:"Oswald","Arial Narrow","Franklin Gothic Medium",sans-serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-type:"Courier Prime","Courier New",ui-monospace,monospace;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font:500 12px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-type)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- kabuk ---------- */
.app{display:grid;grid-template-columns:188px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
.ust{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;
  padding:10px 20px;background:rgba(17,22,29,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.dosya-no{display:flex;flex-direction:column;gap:2px;min-width:0}
.dosya-no b{font:600 20px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.dosya-no span{font:12px/1.2 var(--f-type);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ilerleme{flex:1;display:flex;align-items:center;gap:10px;min-width:0;max-width:420px;margin-left:auto}
.bar{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tag);width:0;transition:width .4s}
.ilerleme span{font:12px var(--f-type);color:var(--muted);white-space:nowrap}
.ust-btn{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint);background:var(--panel2)}
.btn.birincil{background:var(--tag);color:var(--tag-ink);border-color:var(--tag);font-weight:600}
.btn.birincil:hover{filter:brightness(1.08)}
.btn.tehlike{border-color:var(--bad);color:#f2b1a9}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

.rail{display:flex;flex-direction:column;gap:2px;padding:16px 10px;border-right:1px solid var(--line);position:sticky;top:61px;height:calc(100vh - 61px);align-self:start}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:6px;text-align:left;color:var(--muted);font:500 13px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.rail button svg{width:18px;height:18px;flex:none}
.rail button:hover{color:var(--text);background:var(--panel)}
.rail button[aria-current="true"]{color:var(--tag-ink);background:var(--tag)}
.rail .rozet:empty{display:none}
.rail .rozet{margin-left:auto;font:11px var(--f-type);letter-spacing:0;background:var(--panel2);color:var(--text);border-radius:9px;padding:2px 6px}
.rail button[aria-current="true"] .rozet{background:rgba(0,0,0,.18);color:var(--tag-ink)}
main{padding-inline:28px;padding-block:24px 60px;min-width:0}
.view-bas{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-bas h2{font:600 30px/1.05 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.view-bas p{margin:6px 0 0;color:var(--muted);max-width:62ch}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;z-index:40;border-right:0;border-top:1px solid var(--line);
    background:rgba(17,22,29,.97);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .rail button{flex-direction:column;gap:4px;font-size:10px;padding:6px 4px;flex:1;align-items:center}
  .rail .rozet{display:none}
  main{padding-inline:16px;padding-block:18px 96px}
  .ust{padding:10px 16px;flex-wrap:wrap}
  .ilerleme{order:3;flex-basis:100%;max-width:none}
  .ust-btn .etiket{display:none}
  .view-bas h2{font-size:24px}
}

/* ---------- tür renkleri ---------- */
.tur{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
.tur::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--tc)}
[data-tur="foto"]{--tc:var(--t-foto)} [data-tur="mesaj"]{--tc:var(--t-mesaj)} [data-tur="ses"]{--tc:var(--t-ses)}
[data-tur="kamera"]{--tc:var(--t-kamera)} [data-tur="belge"]{--tc:var(--t-belge)}

/* ---------- dosya ---------- */
.dosya-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1100px){.dosya-grid{grid-template-columns:minmax(0,1fr)}}
.kagit{background:var(--paper);color:var(--ink);border-radius:3px;padding:28px 30px 30px;position:relative;box-shadow:0 1px 0 var(--paper2),0 18px 40px -18px rgba(0,0,0,.7)}
.kagit .ust-satir{display:flex;justify-content:space-between;gap:12px;font:12px var(--f-type);color:var(--ink-soft);border-bottom:1px dashed var(--rule);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap}
.kagit .metin{font:15px/1.6 var(--f-type);white-space:pre-wrap;max-width:68ch}
.damga{position:absolute;top:18px;right:22px;transform:rotate(-8deg);border:2.5px solid #a3291f;color:#a3291f;font:600 15px/1 var(--f-disp);letter-spacing:.14em;padding:6px 10px;border-radius:4px;opacity:.78;text-transform:uppercase;pointer-events:none;mix-blend-mode:multiply}
.kagit.brifing{padding-top:66px}
.kagit.brifing .damga{top:14px}
.kagit.brifing h1{font:600 42px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.maktul{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--rule)}
.maktul svg{width:110px;border-radius:2px;filter:grayscale(1) contrast(1.05)}
.maktul p{margin:4px 0 0;font:14px/1.55 var(--f-ui)}
.adimlar{counter-reset:a;display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.adimlar li{counter-increment:a;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;color:var(--muted);font-size:14px}
.adimlar li::before{content:counter(a);font:600 14px/26px var(--f-disp);text-align:center;border:1px solid var(--line);border-radius:50%;width:26px;height:26px;color:var(--tag)}
.adimlar b{color:var(--text);font-weight:600}
.kutu{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.kutu h3{font:600 15px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.sayac-satir{display:grid;grid-template-columns:90px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.sayac-satir .bar{height:5px}
.sayac-satir .bar i{background:var(--tc)}
.sayac-satir span:last-child{text-align:right;font-family:var(--f-type);color:var(--muted)}
.supheliler{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:24px}
.supheli{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.supheli .foto{background:#c9cdd1;position:relative}
.supheli .foto svg{display:block;width:100%;height:auto}
.supheli .plaka{position:absolute;left:10px;bottom:10px;background:#15181c;color:#e9e9e9;font:12px/1.25 var(--f-type);padding:5px 8px;border-radius:2px}
.supheli .govde{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.supheli h3{font:600 19px/1.1 var(--f-disp);letter-spacing:.03em}
.supheli .rol{font-size:13px;color:var(--tag)}
.supheli p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.supheli .alt{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:6px}
.supheli .sayi{font:12px var(--f-type);color:var(--muted);width:100%}
.izinli{font:600 11px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);border-radius:3px;padding:4px 6px}

/* ---------- arşiv ---------- */
.arsiv{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.arsiv{grid-template-columns:minmax(0,1fr)}}
.filtre{position:sticky;top:80px;display:flex;flex-direction:column;gap:18px}
@media (max-width:980px){.filtre{position:static}}
.arama{position:relative}
.arama input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px 10px 36px}
.arama svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.ipucu-yazi{font-size:12px;color:var(--faint);line-height:1.5;margin-top:6px}
.ipucu-yazi code{font-family:var(--f-type);color:var(--muted);background:var(--panel);padding:0 4px;border-radius:3px}
.fgrup{display:flex;flex-direction:column;gap:8px}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.cip:hover{color:var(--text);border-color:var(--faint)}
.cip[aria-pressed="true"]{color:var(--text);border-color:var(--tc,var(--tag));background:color-mix(in srgb,var(--tc,var(--tag)) 16%,transparent)}
.cip small{font:11px var(--f-type);opacity:.75}
select.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.sonuc-bas{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sonuc-bas b{font:600 16px var(--f-disp);letter-spacing:.06em}
.gorunum-sec{display:flex;gap:4px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.kart{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;transition:transform .15s,border-color .15s}
.kart:hover{transform:translateY(-2px);border-color:var(--tc)}
.kart .kucuk{aspect-ratio:4/3;background:#0c0f13;overflow:hidden;display:block}
.kart .kucuk svg,.kart .kucuk .mini{width:100%;height:100%;display:block}
.kart .alt{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px}
.kart .ust-bilgi{display:flex;justify-content:space-between;gap:6px;font:12px var(--f-type);color:var(--muted)}
.kart .kid{color:var(--text);font-weight:700}
.kart .kbas{font-size:13px;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kart.goruldu .kbas,.kart.goruldu .kid{color:var(--muted)}
.kart.goruldu .kucuk{opacity:.7}
.kart .yeni-nokta{position:absolute;top:8px;left:8px;width:9px;height:9px;border-radius:50%;background:var(--tag);box-shadow:0 0 0 2px #0c0f13}
.kart .yildiz{position:absolute;top:6px;right:8px;color:var(--tag);font-size:16px;text-shadow:0 1px 2px #000}
.liste-tablo{width:100%;border-collapse:collapse;font-size:14px}
.liste-tablo td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.liste-tablo tr{cursor:pointer}
.liste-tablo tr:hover td{background:var(--panel)}
.liste-tablo tr.goruldu td{color:var(--muted)}
.liste-tablo .mono{white-space:nowrap}
.daha{display:flex;justify-content:center;margin-top:18px}
.bos{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}

/* mini önizlemeler */
.mini{padding:10px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.mini.m-mesaj{background:#0f1a20}
.mini .bal{max-width:80%;font-size:10.5px;line-height:1.3;padding:5px 7px;border-radius:9px;background:#223540;color:#cfe3ea;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini .bal.sag{align-self:flex-end;background:#2f5a4e;color:#e3f3ec}
.mini.m-belge{background:var(--paper);color:var(--ink);font:9.5px/1.35 var(--f-type)}
.mini.m-belge b{font:600 11px/1.1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px}
.mini.m-belge .ciz{height:4px;background:var(--rule);opacity:.7;border-radius:2px}

/* ---------- görüntüleyici ---------- */
.perde{position:fixed;inset:0;z-index:60;background:rgba(6,8,11,.82);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 40px}
.gor{width:min(1180px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 30px 80px -20px #000}
.gor-bas{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gor-bas .kid{font:700 18px var(--f-type)}
.gor-bas h3{font:500 16px/1.3 var(--f-ui);flex:1;min-width:180px}
.gor-bas .nav{display:flex;gap:6px;margin-left:auto}
.gor-govde{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0}
.gor-govde.tek{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:900px){.gor-govde,.gor-govde.tek{grid-template-columns:minmax(0,1fr)}}
.sahne{background:#0b0e12;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sahne svg{width:100%;height:auto;display:block;border-radius:3px}
.yan{padding:18px;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line);min-width:0}
@media (max-width:900px){.yan{border-left:0;border-top:1px solid var(--line)}}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0}
.meta dt{color:var(--faint);font:500 11px/1.9 var(--f-disp);letter-spacing:.12em;text-transform:uppercase}
.meta dd{margin:0;color:var(--text)}
.aciklama{font:14px/1.6 var(--f-type);white-space:pre-wrap;color:#d3d9e0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;max-height:340px;overflow:auto}
.eylemler{display:flex;flex-wrap:wrap;gap:8px}
.kisayol{font-size:12px;color:var(--faint)}
.kisayol kbd{font:11px var(--f-type);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--muted)}

/* kamera oynatıcı */
.oynatici{display:flex;align-items:center;gap:12px}
.oynatici input[type=range]{flex:1;accent-color:var(--t-kamera)}
.oynatici .sure{font:12px var(--f-type);color:var(--muted);white-space:nowrap}
.yuvarlak{width:40px;height:40px;border-radius:50%;border:0;background:var(--t-kamera);color:#0c1220;display:grid;place-items:center;flex:none}
.yuvarlak svg{width:18px;height:18px}
.olay-log{display:flex;flex-direction:column;gap:6px;font:13px/1.45 var(--f-type)}
.olay-log div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;color:#6f7a88;transition:color .2s}
.olay-log div.gecti{color:#dfe5ec}
.olay-log span:first-child{color:var(--t-kamera)}

/* ses */
.ses-kutu{background:#15110d;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ses-kutu .yuvarlak{background:var(--t-ses)}
.ses-ust{display:flex;align-items:center;gap:14px}
.ses-ust .bilgi{font:12px var(--f-type);color:#b9a895}
.dalga{width:100%;height:96px;display:block}
.transkript{display:flex;flex-direction:column;gap:10px}
.transkript div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;font:15px/1.5 var(--f-type);color:#7f7568;transition:color .2s}
.transkript div b{font:600 12px/1.9 var(--f-disp);letter-spacing:.1em;color:var(--t-ses)}
.transkript div.simdi{color:#fff3e4}
.transkript div.gecti{color:#cbbfae}
.ses-not{font-size:12px;color:#8a7c6a}
.anahtar{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#b9a895;cursor:pointer}

/* telefon */
.telefon{width:min(380px,100%);margin:0 auto;background:#07090b;border-radius:34px;padding:12px;box-shadow:0 0 0 2px #2a3038,0 20px 50px -20px #000}
.telefon .ekran{background:#0e1519;border-radius:24px;overflow:hidden;min-height:440px;display:flex;flex-direction:column}
.telefon .tbas{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#16222a;border-bottom:1px solid #22323c}
.telefon .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--f-disp);color:#0e1519}
.telefon .tbas b{font-size:15px;font-weight:600}
.telefon .tbas small{display:block;color:#7f97a4;font-size:12px}
.akis{padding:16px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.akis .gun{align-self:center;font:11px var(--f-type);color:#7f97a4;background:#16222a;border-radius:8px;padding:3px 10px}
.balon{max-width:82%;padding:8px 11px 6px;border-radius:14px;font-size:14.5px;line-height:1.4;background:#1f3039;color:#e4eff3;align-self:flex-start;border-bottom-left-radius:4px}
.balon.sag{align-self:flex-end;background:#275546;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.balon small{display:block;text-align:right;font:10.5px var(--f-type);color:rgba(228,239,243,.55);margin-top:2px}
.balon .kim{font:600 11px/1.3 var(--f-ui);color:var(--t-mesaj);margin-bottom:2px}
.akis .not{align-self:center;font:12px var(--f-type);color:#8fa4ae;font-style:italic}

/* belge */
.belge-kagit{background:var(--paper);color:var(--ink);border-radius:2px;padding:34px 36px 38px;position:relative;box-shadow:0 20px 40px -20px #000;max-width:780px;margin:0 auto;width:100%;
  background-image:linear-gradient(transparent 0 calc(100% - 1px),rgba(0,0,0,.02) 0);}
.belge-kagit .kaynak{font:12px var(--f-type);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px;padding-right:130px}
.belge-kagit h4{font:600 22px/1.15 var(--f-disp);letter-spacing:.03em;margin:0 0 16px;padding-right:110px}
.belge-kagit pre{margin:0;font:14px/1.6 var(--f-type);white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.belge-kagit.fis{max-width:420px;background:#f4f1ea;border-radius:0;-webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) -6px 100%/12px 100% repeat-x}
.belge-kagit.eposta{background:#f2f3f5;color:#20252c}
.belge-kagit.eposta .kaynak{border-color:#20252c}
@media (max-width:600px){.belge-kagit{padding:24px 18px 28px}.belge-kagit .kaynak,.belge-kagit h4{padding-right:0}.belge-kagit .damga{position:static;display:inline-block;margin-bottom:12px}}

/* ---------- zaman çizelgesi ---------- */

/* ---------------------------------------------------------- ses dalgası */
function dalgaSVG(k, ilerleme = 0, mini = false){
  const r = rng(hash(k.id)), n = mini ? 42 : 120, w = mini ? 400 : 800, h = mini ? 300 : 96;
  const satir = k.satirlar || []; let s = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="dalga" role="img" aria-label="Ses dalgası">`;
  if (mini) s += R(0, 0, w, h, '#15110d');
  const bw = w / n;
  for (let i = 0; i < n; i++){
    const bolum = satir.length ? Math.floor(i / n * satir.length) : 0;
    const sessiz = satir[bolum] && !satir[bolum].konusan;
    const zarf = sessiz ? .12 : .35 + .65 * Math.abs(Math.sin(i * .37 + bolum));
    const yuk = Math.max(3, (h * .8) * zarf * (.35 + r() * .65));
    const renk = i / n <= ilerleme ? '#e28b5e' : (mini ? '#6b5646' : '#4a3d32');
    s += R((i * bw + bw * .18).toFixed(1), ((h - yuk) / 2).toFixed(1), (bw * .64).toFixed(1), yuk.toFixed(1), renk, 'rx="1.5"');
  }
  if (mini) s += `<text x="16" y="36" font-family="Courier Prime,monospace" font-size="22" fill="#e28b5e">▶ ${esc((k.kayit || '').match(/\d+ sn/)?.[0] || '')}</text>`;
  return s + '</svg>';
}

/* ================================================================ arama dili */
function sorguCoz(sorgu){
  const f = {kelime: [], tur: new Set(), kisi: [], gun: null, saat: null, uyari: []};
  const parcalar = [...String(sorgu).matchAll(/"([^"]+)"|(\S+)/g)].map(m => m[1] || m[2]);
  for (const p of parcalar){
    const i = p.indexOf(':'); const a = i > 0 ? sade(p.slice(0, i)) : '', d = i > 0 ? p.slice(i + 1) : '';
    if (d && (a === 'tur' || a === 'tip')){ const t = TUR_ALIAS[sade(d)]; t ? f.tur.add(t) : f.uyari.push('Bilinmeyen tür: ' + d); }
    else if (d && (a === 'kisi' || a === 'kim')) f.kisi.push(sade(d));
    else if (d && (a === 'gun' || a === 'tarih')){ const m = d.match(/^(\d{1,2})(?:\.(\d{1,2}))?$/); m ? f.gun = [+m[1], +(m[2] || 3)] : f.uyari.push('Tarih anlaşılamadı: ' + d); }
    else if (d && a === 'saat'){ const m = d.match(/^(\d{1,2})(?::(\d\d))?-(\d{1,2})(?::(\d\d))?$/); m ? f.saat = [+m[1] * 60 + +(m[2] || 0), +m[3] * 60 + +(m[4] || 0)] : f.uyari.push('Saat aralığı anlaşılamadı: ' + d); }
    else f.kelime.push(sade(p));
  }
  return f;
}
function eslesir(k, f){
  if (f.tur.size && !f.tur.has(k.tur)) return false;
  if (f.kisi.length && !f.kisi.every(q => (k.kisiler || []).some(p => sade(p).includes(q)))) return false;
  if (f.gun || f.saat){ if (k.t == null) return false; const d = new Date(k.t * 60000);
    if (f.gun && (d.getUTCDate() !== f.gun[0] || d.getUTCMonth() + 1 !== f.gun[1])) return false;
    if (f.saat){ const m = d.getUTCHours() * 60 + d.getUTCMinutes(), [a, b] = f.saat; if (a <= b ? (m < a || m > b) : (m < a && m > b)) return false; } }
  return f.kelime.every(w => k._s.includes(w));
}

function metaCiz(k){

function kanitKapat(){ durdurHepsi(); $('#perde').hidden = true; $('#perde').innerHTML = ''; document.body.style.overflow = ''; acik = null; yenile(); }

function durdurHepsi(){ if (oynatici){ oynatici(); oynatici = null; } try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} }

function sahneCiz(k){

function kameraOynatici(k, el){
  const klip = k.klip || {bas: 0, bit: 30}, sure = Math.max(1, klip.bit - klip.bas);
  el.innerHTML = `<div id="kam-ekran"></div><div class="oynatici"><button class="yuvarlak" type="button" id="kam-oynat" aria-label="Oynat">${ikon('oynat')}</button>

    <div class="olay-log" id="kam-log">${(k.olaylar || []).map(o => `<div data-s="${o.saat ? saniyeCoz(o.saat) : ''}"><span>${esc(o.saat)}</span><span>${esc(o.metin)}</span></div>`).join('')}</div>`;
  let p = 0, calis = false, son = 0, raf = 0, tohum = 0;
  const hiz = Math.max(4, Math.min(14, sure / 1.2)) * 1000 / 1; // gerçek süre ne olursa olsun 4–14 sn'de oynar
  const ciz = () => {
    $('#kam-ekran').innerHTML = kameraSVG(k, p, false, tohum);
    $('#kam-ilerle').value = Math.round(p * 1000);

  };
  const adim = t => { if (!calis) return; if (!son) son = t; const dt = t - son; if (dt > 66){ p = Math.min(1, p + dt / hiz); son = t; tohum = (tohum + 1) % 50; ciz(); }
    if (p >= 1){ calis = false; $('#kam-oynat').innerHTML = ikon('oynat'); return; } raf = requestAnimationFrame(adim); };
  $('#kam-oynat').onclick = () => { calis = !calis; if (calis){ if (p >= 1) p = 0; son = 0; raf = requestAnimationFrame(adim); } $('#kam-oynat').innerHTML = ikon(calis ? 'durdur' : 'oynat'); };
  $('#kam-ilerle').oninput = e => { p = e.target.value / 1000; ciz(); };
  oynatici = () => { calis = false; cancelAnimationFrame(raf); };
  ciz();

const saniyeCoz = s => { const [h, m, x] = s.split(':').map(Number); return h * 3600 + m * 60 + (x || 0); };

const KADIN = /^(LEYLA|NERMİN|NERMIN|ECE|ZEYNEP)$/;
function sesOynatici(k, el){
  const satirlar = k.satirlar || [];
  const sesVar = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  el.innerHTML = `<div class="ses-kutu"><div class="ses-ust"><button class="yuvarlak" type="button" id="ses-oynat" aria-label="Dinle">${ikon('oynat')}</button>
    <div><div style="font:600 15px var(--f-disp);letter-spacing:.06em;color:#f3e3cf">${esc(k.baslik)}</div><div class="bilgi">${esc(k.kayit || '')}</div></div></div>
    <div id="dalga">${dalgaSVG(k, 0)}</div>
    <div class="transkript" id="transkript">${satirlar.map((s, i) => `<div data-i="${i}"><b>${esc(s.konusan || '···')}</b><span>${esc(s.metin)}</span></div>`).join('')}</div>
    ${sesVar ? `<label class="anahtar"><input type="checkbox" id="ses-acik" checked> Sesli oku (tarayıcının Türkçe sesi)</label>` : '<div class="ses-not">Bu tarayıcı sesli okumayı desteklemiyor; transkript sırayla vurgulanır.</div>'}</div>`;
  let i = -1, calis = false, zam = 0;
  const vurgula = n => { i = n; $$('#transkript div').forEach((d, j) => { d.classList.toggle('simdi', j === n); d.classList.toggle('gecti', j < n); });
    $('#dalga').innerHTML = dalgaSVG(k, satirlar.length ? (n + 1) / satirlar.length : 1); };
  const bitir = () => { calis = false; clearTimeout(zam); $('#ses-oynat').innerHTML = ikon('oynat'); };
  const siradaki = () => {
    if (!calis) return;
    const n = i + 1; if (n >= satirlar.length){ vurgula(satirlar.length); bitir(); return; }
    vurgula(n);
    const s = satirlar[n], metin = s.metin.replace(/\[[^\]]*\]/g, ' ').replace(/\.{3}/g, ', ').trim();
    const sesli = sesVar && $('#ses-acik') && $('#ses-acik').checked && metin && s.konusan;
    if (sesli){
      const u = new SpeechSynthesisUtterance(metin); u.lang = 'tr-TR';

      u.pitch = s.konusan === 'ASİSTAN' ? 1.1 : KADIN.test(s.konusan) ? 1.25 : .8; u.rate = .95;

    calis = true; i = -1; $('#ses-oynat').innerHTML = ikon('durdur'); siradaki(); };
  oynatici = () => { calis = false; clearTimeout(zam); };
}
function telefonCiz(k){

  (k.notlar || []).forEach(n => govde += `<div class="not">${esc(n)}</div>`);
  return `<div class="telefon"><div class="ekran"><div class="tbas"><div class="avatar" style="background:#9fc7d3">${esc((karsi || '?').charAt(0))}</div><div><b>${esc(karsi || 'Bilinmeyen')}</b><small>${esc(k.kaynak)}</small></div></div><div class="akis">${govde}</div></div></div>`;
}

let seritListe = [];
function seritCiz(){
  const {a, b} = ARALIKLAR[zamanF.aralik];
  let kanit = gorunur().filter(k => k.t != null && k.t >= a && k.t <= b);
  if (zamanF.yalnizIsaretli) kanit = kanit.filter(k => isaretli(k.id));
  kanit.sort((x, y) => x.t - y.t); seritListe = kanit.map(k => k.id);
  const saatler = (b - a) / 60, kap = $('#serit');
  const pxSaat = Math.max(saatler > 48 ? 14 : 70, (kap.clientWidth - 190) / saatler);
  const W = Math.round(190 + saatler * pxSaat + 30), SH = 46;
  const kullanilan = [];
  const atama = kanit.map(k => { const si = SERITLER.findIndex(s => s.k(k)); if (!kullanilan.includes(si)) kullanilan.push(si); return si; });
  const sira = SERITLER.map((s, i) => i).filter(i => kullanilan.includes(i));
  const H = 36 + sira.length * SH + 10;
  const x = t => 190 + (t - a) / 60 * pxSaat;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="IBM Plex Sans,system-ui,sans-serif">`;
  sira.forEach((si, j) => { const y = 36 + j * SH; s += R(0, y, W, SH, j % 2 ? '#18202a' : '#1b2430') + `<text x="12" y="${y + SH / 2 + 4}" font-size="12" fill="#aab4c2">${esc(SERITLER[si].ad)}</text>`; });
  const adim = saatler > 72 ? 24 * 60 : saatler > 20 ? 180 : saatler > 6 ? 60 : 15;
  const bas = Math.ceil(a / adim) * adim;
  for (let t = bas; t <= b; t += adim){ const xx = x(t);
    s += `<path d="M${xx} 28V${H - 6}" stroke="#2c3745" stroke-width="1"/><text x="${xx}" y="20" font-size="11" text-anchor="middle" fill="#8f9bac" font-family="Courier Prime,monospace">${adim >= 1440 ? yaz(t).slice(0, 5) : yaz(t, new Date(t * 60000).getUTCHours() === 0 || t === bas)}</text>`; }
  const olum = dakika('2026-03-14T01:12');
  const doluluk = {};
  kanit.forEach((k, n) => {
    const j = sira.indexOf(atama[n]); const y0 = 36 + j * SH + SH / 2; const xx = x(k.t);
    const kova = j + ':' + Math.round(xx / 9); const kat = doluluk[kova] = (doluluk[kova] || 0) + 1;
    const y = y0 + [0, -12, 12, -6, 6][(kat - 1) % 5];
    const renk = `var(--t-${k.tur})`, gor = GK.has(k.id), isa = isaretli(k.id);
    s += `<g data-ac="${k.id}" style="cursor:pointer"><title>${k.id} · ${yaz(k.t)} · ${esc(k.baslik)}</title>
      <circle cx="${xx}" cy="${y}" r="${isa ? 8 : 6.5}" fill="${gor ? renk : '#11161d'}" stroke="${isa ? '#fff' : renk}" stroke-width="${isa ? 2.5 : 2}" style="fill:${gor ? renk : '#11161d'};stroke:${isa ? '#fff' : renk}"/></g>`;
  });
  if (olum >= a && olum <= b){ const xx = x(olum); s += `<path d="M${xx} 28V${H - 6}" stroke="#d65c4f" stroke-dasharray="4 4"/><text x="${xx + 4}" y="${H - 10}" font-size="10" fill="#d65c4f" font-family="Courier Prime,monospace">Otopsi: tahmini ölüm aralığı 00:30–01:30</text>`; }
  s += '</svg>';
  kap.innerHTML = kanit.length ? s : '<div class="bos" style="border:0">Bu aralıkta gösterilecek kanıt yok.</div>';
}

function panoCiz(){
  const p = $('#pano'); if (!p) return;
  const ks = S.isaretli.map(id => IDLE[id]).filter(Boolean);
  ks.forEach((k, i) => { if (!S.pano.konum[k.id]) S.pano.konum[k.id] = {x: 40 + (i % 8) * 214 + (hash(k.id) % 30), y: 50 + Math.floor(i / 8) * 250 + (hash(k.id) % 40)}; });
  let h = `<svg class="ipler" id="ipler"></svg>`;
  if (!ks.length) h += `<div class="bos-pano">Pano boş. Arşivde bir kanıt açıp <b>İşaretle ve panoya as</b> düğmesine bas; kart buraya raptiyelenir.</div>`;
  ks.forEach(k => { const c = S.pano.konum[k.id], aci = ((hash(k.id) % 7) - 3) * .8;
    h += `<div class="pkart ${ipIlk === k.id ? 'secili' : ''}" data-kart="${k.id}" style="left:${c.x}px;top:${c.y}px;transform:rotate(${aci}deg)"><span class="raptiye"></span><div class="kucuk">${kucuk(k)}</div><div class="yazi"><b>${k.id} · ${yaz(k.t)}</b>${esc(k.baslik)}</div></div>`; });
  S.pano.yapiskan.forEach(n => h += `<div class="yapiskan" data-not="${n.id}" style="left:${n.x}px;top:${n.y}px;transform:rotate(${(hash(n.id) % 5) - 2}deg)"><div class="tutamak"><button type="button" data-sil="${n.id}" aria-label="Notu sil">×</button></div><div class="icerik" contenteditable="true" spellcheck="false">${esc(n.metin)}</div></div>`);
  p.innerHTML = h; ipleriCiz();
  $$('.pkart', p).forEach(el => surukle(el, el, S.pano.konum[el.dataset.kart], () => ipleriCiz(), () => {
    if (ipModu){ const id = el.dataset.kart; if (!ipIlk){ ipIlk = id; el.classList.add('secili'); }
      else if (ipIlk !== id){ if (!S.pano.ipler.some(([a, b]) => (a === ipIlk && b === id) || (a === id && b === ipIlk))) S.pano.ipler.push([ipIlk, id]); ipIlk = null; kaydet(); panoCiz(); } } }));
  $$('.pkart', p).forEach(el => el.addEventListener('dblclick', () => kanitAc(el.dataset.kart, S.isaretli)));
  $$('.yapiskan', p).forEach(el => { const n = S.pano.yapiskan.find(x => x.id === el.dataset.not);
    surukle(el, $('.tutamak', el), n, () => {}, () => {});
    $('.icerik', el).addEventListener('input', e => { n.metin = e.target.innerText; kaydet(); }); });
  p.onclick = e => { const s = e.target.closest('[data-sil]'); if (s){ S.pano.yapiskan = S.pano.yapiskan.filter(x => x.id !== s.dataset.sil); kaydet(); panoCiz(); } };
}
function ipleriCiz(){
  const svg = $('#ipler'); if (!svg) return;
  let s = '';
  S.pano.ipler.forEach(([a, b], i) => { const A = S.pano.konum[a], B = S.pano.konum[b]; if (!A || !B || !isaretli(a) || !isaretli(b)) return;
    const x1 = A.x + 85, y1 = A.y + 1, x2 = B.x + 85, y2 = B.y + 1, mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + Math.hypot(x2 - x1, y2 - y1) * .12;
    const d = `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`;
    s += `<path d="${d}" stroke="rgba(0,0,0,.35)" stroke-width="3" fill="none" transform="translate(2 4)"/><path d="${d}" stroke="#c43b2c" stroke-width="2.4" fill="none"/>`;
    if (ipModu) s += `<path class="hit" data-ip="${i}" d="${d}" stroke="transparent" stroke-width="14" fill="none"><title>İpi kaldır</title></path>`; });
  svg.innerHTML = s;
  $$('[data-ip]', svg).forEach(p => p.addEventListener('click', () => { S.pano.ipler.splice(+p.dataset.ip, 1); kaydet(); ipleriCiz(); }));
}
function surukle(el, tutamak, konum, hareket, tik){
  let bas = null;
  tutamak.addEventListener('pointerdown', e => { if (e.target.closest('button') || e.target.closest('[contenteditable]')) return;
    bas = {x: e.clientX, y: e.clientY, ox: konum.x, oy: konum.y, oynadi: false}; tutamak.setPointerCapture(e.pointerId); e.preventDefault(); });
  tutamak.addEventListener('pointermove', e => { if (!bas) return; const dx = e.clientX - bas.x, dy = e.clientY - bas.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) bas.oynadi = true;
    konum.x = Math.max(0, Math.min(1800 - 170, bas.ox + dx)); konum.y = Math.max(8, Math.min(1150 - 120, bas.oy + dy));
    el.style.left = konum.x + 'px'; el.style.top = konum.y + 'px'; hareket(); });
  const birak = () => { if (!bas) return; const oynadi = bas.oynadi; bas = null; kaydet(); if (!oynadi) tik(); };
  tutamak.addEventListener('pointerup', birak); tutamak.addEventListener('pointercancel', () => { bas = null; });
}

    const c = S.cevap[i] || {secim: null, kanit: ''};
    return `<fieldset class="soru" style="margin:0"><legend class="sr" style="position:absolute;left:-9999px">${esc(s.soru)}</legend><h3><span>${i + 1}.</span>${esc(s.soru)}</h3>
      <div class="secenekler">${s.secenekler.map((o, j) => `<label class="secenek"><input type="radio" name="s${i}" id="s${i}-${j}" value="${j}" ${c.secim === j ? 'checked' : ''}>${esc(o)}</label>`).join('')}</div>
      <div class="destek"><label for="d${i}">Destekleyen kanıtlar (kimlikleri boşlukla ayır)</label><input id="d${i}" data-d="${i}" value="${esc(c.kanit)}" placeholder="ör. B-012 K-044">
      ${isaretliler.length ? `<div class="cipler">${isaretliler.map(id => `<button class="cip" type="button" data-ekle="${i}" data-id="${id}" aria-pressed="${c.kanit.split(/\s+/).includes(id)}">★ ${id}</button>`).join('')}</div>` : ''}</div></fieldset>`; }).join('')}
    <div class="gonder"><button class="btn birincil" type="submit">Suçlamayı gönder</button><span style="color:var(--muted);font-size:13px">${S.ipucu ? `Alınan ipucu: ${S.ipucu} (−${S.ipucu * 5} puan)` : 'İpucu almadın.'}</span></div></form>`;
  const form = $('#sucla-form');
  form.addEventListener('change', e => { const m = e.target.name && e.target.name.match(/^s(\d+)$/); if (m){ (S.cevap[m[1]] ||= {secim: null, kanit: ''}).secim = +e.target.value; kaydet(); } });
  form.addEventListener('input', e => { if (e.target.dataset.d != null){ (S.cevap[e.target.dataset.d] ||= {secim: null, kanit: ''}).kanit = e.target.value; kaydet(); } });
  form.addEventListener('click', e => { const b = e.target.closest('[data-ekle]'); if (!b) return; const i = b.dataset.ekle, inp = $('#d' + i);
    let ids = inp.value.split(/[\s,]+/).filter(Boolean); ids = ids.includes(b.dataset.id) ? ids.filter(x => x !== b.dataset.id) : ids.concat(b.dataset.id);
    inp.value = ids.join(' '); (S.cevap[i] ||= {secim: null, kanit: ''}).kanit = inp.value; b.setAttribute('aria-pressed', String(ids.includes(b.dataset.id))); kaydet(); });
  form.addEventListener('submit', async e => { e.preventDefault();
    const eksik = V.sorular.map((s, i) => S.cevap[i]?.secim == null ? i + 1 : 0).filter(Boolean);
    if (eksik.length){ await sor({baslik: 'Eksik cevap', metin: `Şu sorular cevapsız: ${eksik.join(', ')}.`, evet: 'Tamam', tek: true}); return; }
    if (!await sor({baslik: 'Vakayı kapat', metin: 'Suçlama gönderildiğinde cevaplar kilitlenir ve çözüm açılır. Emin misin?', evet: 'Gönder'})) return;
    puanla(); karneCiz(); rozetler(); });
};
const RUTBE = o => o >= .95 ? 'Efsanevi Başkomiser' : o >= .8 ? 'Başkomiser' : o >= .6 ? 'Dedektif' : o >= .4 ? 'Komiser Yardımcısı' : 'Çaylak';
function puanla(){
  let puan = 0;
  const sonuc = V.sorular.map((s, i) => { const c = S.cevap[i], dogru = c.secim === G.cevaplar[i].dogru;
    const ids = (c.kanit || '').split(/[\s,]+/).map(x => idCoz(x)).filter(Boolean).map(k => k.id);
    const destek = dogru && ids.some(id => G.cevaplar[i].destek.includes(id) && GK.has(id));
    puan += (dogru ? 10 : 0) + (destek ? 5 : 0); return {dogru, destek}; });
  const azami = V.sorular.length * 15; puan = Math.max(0, puan - S.ipucu * 5);
  S.sonuc = {puan, azami, rutbe: RUTBE(puan / azami), sorular: sonuc, katil: sonuc[4].dogru, incelenen: S.gorulen.length}; kaydet();
}
function karneCiz(){
  const r = S.sonuc, v = $('#v-sucla');
  const yorum = r.katil && r.puan >= r.azami * .75 ? 'Komiser Güneş dosyayı kapatıyor: "Bu bir isim değil, bir dava. Savcılık bunu mahkemeye taşıyabilir. İyi iş, dedektif."'
    : r.katil ? 'Komiser Güneş: "Doğru kişiyi buldun ama hikâyede delikler var. İyi bir avukat bu delikleri bulur."'
    : 'Komiser Güneş sessizce dosyayı geri itiyor: "Yanlış kişiyi mahkemeye gönderirsek gerçek katil kapıdan çıkıp gider."';
  v.innerHTML = `<div class="view-bas"><div><div class="eyebrow">Vaka kapandı</div><h2>Değerlendirme</h2></div><button class="btn tehlike" type="button" id="bastan">Baştan başla</button></div>
  <div class="karne"><div class="kutu"><div class="puan tnum">${r.puan}<small> / ${r.azami}</small></div><div class="rutbe">${esc(r.rutbe)}</div>
    <p style="color:var(--muted);margin:10px 0 0">${r.incelenen} kanıt inceledin · ${S.ipucu} ipucu · ${S.izinler.length} arama izni</p>
    <p style="margin:14px 0 0">${esc(yorum)}</p>
    <ul>${V.sorular.map((s, i) => `<li><span class="${r.sorular[i].dogru ? 'ok' : 'no'}">${r.sorular[i].dogru ? '✔' : '✘'}</span><span>${esc(s.soru)}</span><small>${r.sorular[i].destek ? '+kanıt' : ''}</small></li>`).join('')}</ul></div>
    <article class="kagit"><div class="damga">Çözüm</div><div class="ust-satir"><span>KOMİSER GÜNEŞ · KAPANIŞ RAPORU</span></div><div class="metin">${esc(G.cozum)}</div></article></div>`;
  $('#bastan').onclick = async () => { if (!await sor({baslik: 'Baştan başla', metin: 'Tüm ilerleme, pano ve notlar silinecek.', evet: 'Sil ve baştan başla', tehlike: true})) return;
    S = yeniDurum(); GK = new Set(); kaydet(); ilerleme(); git('dosya'); };
}

/* ================================================================ DEFTER · İPUCU */
function defterAc(on = ''){
  const d = $('#defter'); d.hidden = false;
  d.innerHTML = `<div class="cekmece-bas"><h3>Defter</h3><button class="btn" type="button" data-kapat aria-label="Kapat">${ikon('kapat')}</button></div>
    <div class="defter-notlar">${S.notlar.length ? S.notlar.map((n, i) => `<div class="dnot"><small>${esc(n.zaman)}</small>${esc(n.metin)}<button type="button" data-nsil="${i}" aria-label="Notu sil">×</button></div>`).join('') : '<p style="color:var(--muted)">Defter boş. Çelişkileri yaz: "Burak 22:00 dedi, kamera 22:12 gösteriyor" gibi.</p>'}</div>
    <form class="defter-yaz" id="defter-form"><label for="defter-metin" class="eyebrow">Yeni not</label><textarea id="defter-metin">${esc(on)}</textarea><button class="btn birincil" type="submit">Deftere yaz</button></form>`;
  const ta = $('#defter-metin'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  d.onclick = e => { if (e.target.closest('[data-kapat]')){ d.hidden = true; return; } const s = e.target.closest('[data-nsil]'); if (s){ S.notlar.splice(+s.dataset.nsil, 1); kaydet(); defterAc(ta.value); } };
  $('#defter-form').onsubmit = e => { e.preventDefault(); const m = ta.value.trim(); if (!m) return; const t = new Date();
    S.notlar.push({zaman: p2(t.getDate()) + '.' + p2(t.getMonth() + 1) + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes()), metin: m}); kaydet(); defterAc(); bildir('Not deftere yazıldı'); };
}
async function ipucuAl(){
  if (S.ipucu >= G.ipuclari.length){ await sor({baslik: 'Komiser Güneş', metin: '"Sana verebileceğim her şeyi verdim. Gerisi senin işin."', evet: 'Tamam', tek: true}); return; }
  const onceki = G.ipuclari.slice(0, S.ipucu).map((x, i) => `${i + 1}. ${x}`).join('\n\n');
  if (!await sor({baslik: `İpucu ${S.ipucu + 1}/${G.ipuclari.length}`, metin: (onceki ? 'Önceki ipuçların:\n\n' + onceki + '\n\n' : '') + 'Yeni bir ipucu 5 puana mal olacak. Alınsın mı?', evet: 'İpucunu al (−5)'})) return;
  S.ipucu++; kaydet();
  await sor({baslik: `Komiser Güneş · ipucu ${S.ipucu}`, metin: G.ipuclari[S.ipucu - 1], evet: 'Anlaşıldı', tek: true});
}

/* ================================================================ olaylar ve başlatma */
document.addEventListener('keydown', e => {
  if (!$('#perde').hidden && acik){
    if (e.target.matches('input,textarea,[contenteditable]')) return;
    const i = acikListe.indexOf(acik.id);
    if (e.key === 'Escape') kanitKapat();
    else if (e.key === 'ArrowRight' && i < acikListe.length - 1) kanitAc(acikListe[i + 1], acikListe);
    else if (e.key === 'ArrowLeft' && i > 0) kanitAc(acikListe[i - 1], acikListe);
    else if (sade(e.key) === 'i' || e.key === 'p') $('#btn-isaret')?.click();
    return;
  }
  if (e.key === 'Escape' && !$('#defter').hidden) $('#defter').hidden = true;
  if (e.key === '/' && S.gorunum === 'arsiv' && !e.target.matches('input,textarea,[contenteditable]')){ e.preventDefault(); $('#ara').focus(); }
});
document.addEventListener('click', e => {
  const g = e.target.closest('[data-git]'); if (g){ git(g.dataset.git); return; }
  const k = e.target.closest('#v-dosya [data-kisi]'); if (k){ arsivF.q = 'kisi:' + k.dataset.kisi; arsivF.turler.clear(); arsivF.kisi = ''; arsivF.gun = ''; arsivF.yalniz = ''; arsivF.siralama = 'zaman'; git('arsiv'); return; }
  const z = e.target.closest('#v-dosya [data-izin]'); if (z){ izinIste(z.dataset.izin).then(() => { if (S.gorunum === 'dosya') CIZ.dosya(); }); }
});
$('#btn-defter').onclick = () => { const d = $('#defter'); d.hidden ? defterAc() : (d.hidden = true); };
$('#btn-ipucu').onclick = ipucuAl;

function basla(veri){
  S = (veri && veri.S) || yukle() || yeniDurum();
  GK = new Set(S.gorulen);
  railCiz(); ilerleme();
  const hash_ = (location.hash || '').slice(1);
  git(CIZ[hash_] ? hash_ : S.gorunum || 'dosya');
  if (window.claude?.hot?.snapshot) try { window.claude.hot.snapshot(() => ({S})); } catch (e) {}
}
window.claude?.hot?.ready ? window.claude.hot.ready(basla) : basla(window.claude?.hot?.data ?? {});
})();
</script>
